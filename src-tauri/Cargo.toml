[package]
name = "spent-app"
version = "1.2.1"
description = "A minimalist, local-first personal finance tracker"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
csv = "1.3"
# kriya authoring SDK: wrap existing Database methods as governed actions + generate tool schemas.
# default-features = false keeps it lean — no Tauri runtime, no HTTP client. The kriya-mcp governor
# (separate binary) provides the policy/approval/budget/audit at runtime.
kriya = { version = "0.1.3", default-features = false }
# Resolve the same per-OS data dir Tauri uses, so `spent --exec` opens the GUI's database.
dirs = "5"

[target.'cfg(target_os = "linux")'.dependencies]
rusqlite = { version = "0.31" }

[target.'cfg(not(target_os = "linux"))'.dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-shell = "2.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# LOCAL DEMO ONLY (remove before the PR — kriya 0.1.3 isn't on crates.io yet).
[patch.crates-io]
kriya = { path = "../../../crates/kriya" }
